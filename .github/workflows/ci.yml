name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: Sintaxe + testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verificar sintaxe dos JS
        run: node scripts/check-syntax.js

      - name: Rodar suíte de testes
        run: node --test test/**/*.test.js
